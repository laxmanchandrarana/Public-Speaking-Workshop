services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_UID: 1001
        APP_GID: 1001
    container_name: psw-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_NAME=public_speaking_workshop
      - DB_USER=ubuntu
      - DB_PASSWORD=
      - DB_HOST=/var/run/postgresql
      - DB_PORT=5432
      - ALLOWED_HOSTS=psw-api.lcrana.in,localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=https://psw.lcrana.in,http://localhost:5173,http://127.0.0.1:5173
      - CSRF_TRUSTED_ORIGINS=https://psw.lcrana.in,https://psw-api.lcrana.in
    volumes:
      - /var/run/postgresql:/var/run/postgresql
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - psw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://psw-api.lcrana.in
    container_name: psw-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - psw-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
networks:
  psw-network:
    driver: bridge
